{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card mt-5 border-0">
            <div class="card-body p-5">
                <h3 class="mb-4 fw-bold text-dark border-bottom pb-3">
                    <i class="fas {{ 'fa-edit' if expense else 'fa-plus-circle' }} text-primary me-2"></i>{{ legend }}
                </h3>
                <form method="POST" action="">
                    <div class="mb-3">
                        <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                        <select class="form-select form-select-lg bg-light" id="category" name="category" required>
                            <option value="" disabled {% if not expense %}selected{% endif %}>Select a category</option>
                            {% set categories = ['Food', 'Travel', 'Shopping', 'Bills', 'Entertainment', 'Healthcare', 'Other'] %}
                            {% for cat in categories %}
                                <option value="{{ cat }}" {% if expense and expense.category == cat %}selected{% endif %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="amount" class="form-label fw-semibold">Amount <span class="text-danger">*</span></label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light">$</span>
                            <input type="number" step="0.01" min="0.01" class="form-control bg-light" id="amount" name="amount" placeholder="0.00" value="{{ expense.amount if expense else '' }}" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="comments" class="form-label fw-semibold">Comments (Optional)</label>
                        <textarea class="form-control bg-light" id="comments" name="comments" rows="3" placeholder="Add some details...">{{ expense.comments if expense else '' }}</textarea>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-light btn-lg">Cancel</a>
                        <button type="submit" class="btn btn-primary btn-lg px-4 shadow-sm">Save Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
