{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="card border-0">
        <div class="card-body p-5 auth-form">
            <div class="text-center mb-4">
                <i class="fas fa-user-circle fa-3x text-primary mb-3"></i>
                <h3 class="font-weight-light text-dark fw-bold">Welcome Back</h3>
                <p class="text-muted">Sign in to manage your expenses</p>
            </div>
            <form method="POST" action="">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    <label for="email"><i class="fas fa-envelope me-2 text-muted"></i>Email address</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                    <label for="password"><i class="fas fa-lock me-2 text-muted"></i>Password</label>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-primary btn-lg shadow-sm" type="submit">Sign In</button>
                </div>
            </form>
            <div class="text-center mt-4">
                <span class="text-muted">Don't have an account?</span> 
                <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold text-primary ms-1">Create one</a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
