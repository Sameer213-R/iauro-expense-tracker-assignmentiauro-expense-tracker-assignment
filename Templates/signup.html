{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="card border-0">
        <div class="card-body p-5 auth-form">
            <div class="text-center mb-4">
                <i class="fas fa-user-plus fa-3x text-primary mb-3"></i>
                <h3 class="font-weight-light text-dark fw-bold">Create Account</h3>
                <p class="text-muted">Start tracking your expenses today</p>
            </div>
            <form method="POST" action="">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="full_name" name="full_name" placeholder="John Doe" required>
                    <label for="full_name"><i class="fas fa-user me-2 text-muted"></i>Full Name</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                    <label for="email"><i class="fas fa-envelope me-2 text-muted"></i>Email address</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                    <label for="password"><i class="fas fa-lock me-2 text-muted"></i>Password</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                    <label for="confirm_password"><i class="fas fa-lock me-2 text-muted"></i>Confirm Password</label>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-primary btn-lg shadow-sm" type="submit">Sign Up</button>
                </div>
            </form>
            <div class="text-center mt-4">
                <span class="text-muted">Already have an account?</span> 
                <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold text-primary ms-1">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
